apply plugin: 'com.android.library'
apply from: '../prepare-robolectric.gradle'

def getExtOrDefault(name, defaultVal) {
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : defaultVal
}

android {
    compileSdkVersion getExtOrDefault('compileSdkVersion', 25)
    buildToolsVersion getExtOrDefault('buildToolsVersion', "26.0.2")

    defaultConfig {
        minSdkVersion getExtOrDefault('minSdkVersion', 16)
        targetSdkVersion getExtOrDefault('targetSdkVersion', 23)
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }
    lintOptions {
        abortOnError false
    }

    testOptions {
        unitTests.all { t ->
            reports {
                html.enabled true
            }
            testLogging {
                events "passed", "skipped", "failed", "standardOut", "standardError"
            }
            afterSuite { desc, result ->
                if (!desc.parent) { // will match the outermost suite
                    def output = "      ${result.resultType} (${result.successfulTestCount} successes, ${result.failedTestCount} failures, ${result.skippedTestCount} skipped)     "
                    def repeatLength = output.length()
                    println '\n' + ('-' * repeatLength) + '\n' + output + '\n' + ('-' * repeatLength) + '\n'

                    println "see report at file://${t.reports.html.destination}/index.html"
                }
            }
        }
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])

	implementation 'com.android.support:design:25.3.1'
    implementation "com.android.support:appcompat-v7:25.3.1"
    implementation "androidx.core:core-ktx:1.6.0"

    // node_modules
    implementation "com.facebook.react:react-native:+"

    // third party
    implementation "com.aurelhubert:ahbottomnavigation:2.0.6"
    implementation 'com.balysv.materialmenu:material-menu-toolbar:1.5.4'

    // tests
    testImplementation "junit:junit:4.12"
    testImplementation "org.robolectric:robolectric:3.1.4"
    testImplementation 'org.assertj:assertj-core:2.5.0'
}
